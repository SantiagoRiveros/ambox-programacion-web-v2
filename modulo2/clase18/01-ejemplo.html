<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="titulo">Bienvenidos al curso</h1>
    <p class="descripcion">Estamos aprendiendo Javascript</p>
    <script>
      const titulo = document.querySelector("#titulo");
      const descripcion = document.querySelector(".descripcion");

      console.log(titulo);
      console.log(descripcion);
      /* 
      document: representa el documento HTML
      querySelector(): busca un elemento
      const titulo guarda la referencia al elemento encontrado
      el # indica un ID y el . indica una clase, como los selectores de CSS
    
      */
    </script>
  </body>
</html>
